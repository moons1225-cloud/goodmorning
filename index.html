<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Good Morning, Yunji</title>
    <style>
      :root {
        --sky: #78c6f2;
        --ink: #3b2a5a;
        --sun: #ffc93c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--sky);
        font-family: "Nunito", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .player {
        position: relative;
        width: min(100%, 177.78vh);
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 8px 0 rgba(40, 30, 80, 0.18);
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
      }
      #play {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        border: 0;
        cursor: pointer;
        background: rgba(120, 198, 242, 0.55);
        color: var(--ink);
        font-family: inherit;
        font-weight: 900;
        font-size: clamp(22px, 5vw, 48px);
        line-height: 1.1;
      }
      #play .btn {
        width: clamp(80px, 18vw, 160px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--sun);
        display: grid;
        place-items: center;
        box-shadow: 0 6px 0 rgba(40, 30, 80, 0.2);
      }
      #play .btn::before {
        content: "";
        margin-left: 12%;
        border-style: solid;
        border-width: 0.9em 0 0.9em 1.5em;
        border-color: transparent transparent transparent var(--ink);
        font-size: clamp(20px, 4.5vw, 40px);
      }
      #play[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="player">
        <video id="v" src="good-morning-yunji-30s.mp4" playsinline preload="auto" controls></video>
        <button id="play" type="button" aria-label="영상 재생">
          <span class="btn"></span>
          <span>윤지야, 좋은 아침!</span>
        </button>
      </div>
    </main>
    <script>
      const v = document.getElementById("v");
      const play = document.getElementById("play");
      // Try to start with sound right away; browsers that block it show the big button instead.
      v.play().then(() => (play.hidden = true)).catch(() => {});
      play.addEventListener("click", () => {
        play.hidden = true;
        v.play();
      });
      v.addEventListener("play", () => (play.hidden = true));
    </script>
  </body>
</html>
